<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch 2 Legacy</title>
    <meta name="theme-color" content="#f7f7f7">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="appicons/AppIcon128.png">
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      #ruffle {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: transparent;
      }

      /* Home hotspot */
      #homeHotspot {
        position: fixed;
        top: 0;
        left: 0;
        width: 82px;
        height: 30px;
        z-index: 10001;
        pointer-events: auto;
        background: transparent;
      }

      /* Tips hotspot: half the Home hotspot width */
      #tipsHotspot {
        position: fixed;
        top: 0;
        left: 212px;
        width: 44px;
        height: 30px;
        z-index: 10001;
        pointer-events: auto;
        background: transparent;
      }

      /* About hotspot: half the Home hotspot width */
      #aboutHotspot {
        position: fixed;
        top: 0;
        left: 250px;
        width: 41px;
        height: 30px;
        z-index: 10001;
        pointer-events: auto;
        background: transparent;
      }

      #homeHotspot,
      #tipsHotspot,
      #aboutHotspot {
        cursor: pointer;
      }

      #homeHotspot[hidden],
      #tipsHotspot[hidden],
      #aboutHotspot[hidden],
      #homeTooltip[hidden],
      #tipsTooltip[hidden],
      #aboutTooltip[hidden] {
        display: none !important;
      }

      /* Pointer cursor while hovering over hotspots */
      html.hotspot-hover,
      html.hotspot-hover body,
      html.hotspot-hover body *,
      html.hotspot-hover body canvas,
      html.hotspot-hover body ruffle-player {
        cursor: pointer !important;
      }

      /* Scratch-style tooltips */
      #homeTooltip,
      #tipsTooltip,
      #aboutTooltip {
        position: fixed;
        top: 34px;
        z-index: 10002;
        padding: 6px 10px;
        border-radius: 5px;
        background: #333;
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: normal;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-3px);
        pointer-events: none;
        transition:
          opacity 0.12s ease,
          transform 0.12s ease,
          visibility 0.12s;
      }

      #homeTooltip {
        left: 12px;
      }

      #tipsTooltip {
        left: 215px;
      }

      #aboutTooltip {
        left: 250px;
      }

      #homeTooltip::before,
      #tipsTooltip::before,
      #aboutTooltip::before {
        content: "";
        position: absolute;
        left: 12px;
        top: -6px;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 7px solid #333;
        margin-bottom: -1px;
      }

      #homeTooltip.visible,
      #tipsTooltip.visible,
      #aboutTooltip.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* Tips sidebar */
      #tipsSidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: min(315px, 90vw);
        height: 100vh;
        height: 100dvh;
        z-index: 10010;
        background: #fff;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.25s ease,
          visibility 0.25s;
      }

      #tipsSidebar.open {
        transform: translateX(0);
        visibility: visible;
      }

      #tipsSidebar[hidden] {
        display: none !important;
      }

      #tipsSidebarHeader {
        min-height: 48px;
        box-sizing: border-box;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #626366;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
      }

      #closeTips {
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #fff;
        font-size: 26px;
        cursor: pointer;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #closeTips:hover {
        background: rgba(0, 0, 0, 0.12);
      }

      #closeTips:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -4px;
      }

      #tipsFrame {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 0;
        background: #fff;
      }

      /* Boot screen */
      #boot {
        position: fixed;
        inset: 0;
        background: #f7f7f7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      #bootIcon {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        margin-bottom: 18px;
      }

      #bootTitle {
        font-size: 28px;
        font-weight: bold;
        color: #ffab19;
        margin-bottom: 20px;
      }

      #barContainer {
        width: 220px;
        height: 10px;
        background: #ddd;
        border-radius: 6px;
        overflow: hidden;
      }

      #bar {
        width: 40%;
        height: 100%;
        background: #ffab19;
        animation: load 1.2s infinite ease-in-out;
      }

      @keyframes load {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(300%);
        }
      }

      #status {
        margin-top: 14px;
        font-size: 12px;
        color: #666;
      }

      #powered {
        margin-top: 10px;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #powered img {
        width: auto;
        height: 14px;
      }

      @media (prefers-reduced-motion: reduce) {
        #tipsSidebar {
          transition: none;
        }

        #homeTooltip,
        #tipsTooltip,
        #aboutTooltip {
          transition: none;
        }
      }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  </head>
  <body>
    <!-- Home hotspot -->
    <div id="homeHotspot" aria-label="Home" role="link" tabindex="0" hidden></div>
    <!-- Tips hotspot -->
    <div id="tipsHotspot" aria-label="Tips" role="button" tabindex="0" hidden></div>
    <!-- About hotspot -->
    <div id="aboutHotspot" aria-label="About Scratch" role="link" tabindex="0" hidden></div>
    <!-- Hotspot tooltips -->
    <div id="homeTooltip" role="tooltip" hidden>Home</div>
    <div id="tipsTooltip" role="tooltip" hidden>Scratch Tips</div>
    <div id="aboutTooltip" role="tooltip" hidden>About Scratch</div>
    <!-- Tips sidebar -->
    <aside id="tipsSidebar" aria-label="Scratch Tips" aria-hidden="true" hidden>
      <div id="tipsSidebarHeader">
        <span>Tips</span>
        <button id="closeTips" type="button" aria-label="Close Tips">&times;</button>
      </div>
      <iframe id="tipsFrame" title="Scratch Tips" src="https://proxy.webtoppings.bar/+iframe-demo?url=https://scratch.mit.edu/help/studio/tips/home/" loading="lazy"></iframe>
    </aside>
    <!-- Boot screen -->
    <div id="boot">
      <img id="bootIcon" src="https://scratch2.cattymod.app/appicons/AppIcon128.png" alt="">
      <div id="bootTitle">Scratch 2 Legacy</div>
      <div id="barContainer">
        <div id="bar"></div>
      </div>
      <div id="status">Starting Editor...</div>
      <div id="powered">
        <span>Powered by</span>
        <img src="https://ruffle.rs/demo/logo.svg" alt="Ruffle">
      </div>
    </div>
    <!-- Ruffle player -->
    <div id="ruffle"></div>
    <script>
      const HOME_URL = "https://scratch2.cattymod.app";
      const ABOUT_URL = "https://scratch.mit.edu";
      const TOOLTIP_DELAY = 500;
      const homeHotspot = document.getElementById("homeHotspot");
      const tipsHotspot = document.getElementById("tipsHotspot");
      const aboutHotspot = document.getElementById("aboutHotspot");
      const homeTooltip = document.getElementById("homeTooltip");
      const tipsTooltip = document.getElementById("tipsTooltip");
      const aboutTooltip = document.getElementById("aboutTooltip");
      const tipsSidebar = document.getElementById("tipsSidebar");
      const closeTips = document.getElementById("closeTips");
      let tooltipTimer = null;
      let hoveredHotspot = null;
      let sidebarTimer = null;
      let sidebarWasOpened = false;
      const hotspotTooltips = new Map([
        [homeHotspot, homeTooltip],
        [tipsHotspot, tipsTooltip],
        [aboutHotspot, aboutTooltip]
      ]);

      function setHotspotHover(hotspot) {
        clearTimeout(tooltipTimer);
        hoveredHotspot = hotspot;
        document.documentElement.classList.toggle("hotspot-hover", hotspot !== null);
        for (const tooltip of hotspotTooltips.values()) {
          tooltip.classList.remove("visible");
        }
        if (!hotspot) {
          return;
        }
        const tooltip = hotspotTooltips.get(hotspot);
        tooltipTimer = setTimeout(() => {
          if (hoveredHotspot === hotspot) {
            tooltip.hidden = false;
            requestAnimationFrame(() => {
              if (hoveredHotspot === hotspot) {
                tooltip.classList.add("visible");
              }
            });
          }
        }, TOOLTIP_DELAY);
      }
      for (const hotspot of hotspotTooltips.keys()) {
        hotspot.addEventListener("mouseenter", () => {
          setHotspotHover(hotspot);
        });
        hotspot.addEventListener("mouseleave", () => {
          if (hoveredHotspot === hotspot) {
            setHotspotHover(null);
          }
        });
      }
      document.addEventListener("mouseleave", () => {
        setHotspotHover(null);
      });
      // Home navigation
      function goHome() {
        window.location.assign(HOME_URL);
      }
      homeHotspot.addEventListener("click", goHome);
      homeHotspot.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          goHome();
        }
      });
      // About navigation
      function goAbout() {
        window.location.assign(ABOUT_URL);
      }
      aboutHotspot.addEventListener("click", goAbout);
      aboutHotspot.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          goAbout();
        }
      });
      // Tips sidebar
      function openTips() {
        clearTimeout(sidebarTimer);
        // Refresh the Tips page every time the sidebar opens.
        const tipsFrame = document.getElementById("tipsFrame");
        tipsFrame.src = tipsFrame.src;
        tipsSidebar.hidden = false;
        tipsSidebar.setAttribute("aria-hidden", "false");
        requestAnimationFrame(() => {
          tipsSidebar.classList.add("open");
        });
      }

      function hideTips() {
        if (tipsSidebar.hidden) {
          return;
        }
        tipsSidebar.classList.remove("open");
        tipsSidebar.setAttribute("aria-hidden", "true");
        clearTimeout(sidebarTimer);
        sidebarTimer = setTimeout(() => {
          if (!tipsSidebar.classList.contains("open")) {
            tipsSidebar.hidden = true;
          }
        }, 250);
      }
      tipsHotspot.addEventListener("click", openTips);
      tipsHotspot.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openTips();
        }
      });
      closeTips.addEventListener("click", hideTips);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !tipsSidebar.hidden) {
          hideTips();
          tipsHotspot.focus();
        }
      });
      // Initialize Ruffle
      window.addEventListener("load", async () => {
        try {
          if (!window.RufflePlayer) {
            throw new Error("Ruffle failed to initialize.");
          }
          const ruffle = window.RufflePlayer.newest();
          const player = ruffle.createPlayer();
          player.style.position = "absolute";
          player.style.top = "0";
          player.style.left = "0";
          player.style.width = "100vw";
          player.style.height = "100vh";
          player.style.margin = "0";
          player.style.padding = "0";
          document.getElementById("ruffle").appendChild(player);
          const response = await fetch("https://scratch2.cattymod.app/scratch.swf");
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          await player.load(url);
          player.play();
          setTimeout(() => {
            const boot = document.getElementById("boot");
            if (!boot) {
              return;
            }
            boot.style.transition = "opacity 0.4s ease";
            boot.style.opacity = "0";
            setTimeout(() => {
              boot.remove();
              // Enable all hotspots once loading completes.
              homeHotspot.hidden = false;
              tipsHotspot.hidden = false;
              aboutHotspot.hidden = false;
            }, 400);
          }, 800);
        } catch (error) {
          console.error("Failed to load Scratch 2:", error);
          document.getElementById("status").textContent = "Failed to load Scratch 2. Check the console.";
        }
      });
    </script>
  </body>
</html>
