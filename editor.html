<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Scratch 2 Legacy</title>

    <meta name="theme-color" content="#f7f7f7">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="appicons/AppIcon128.png">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #ruffle {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: transparent;
        }

        /* Invisible, click-through Home detection area */
        #homeHotspot {
            position: fixed;
            top: 0;
            left: 0;
            width: 75px;
            height: 30px;
            z-index: 10001;
            pointer-events: none;
            background: transparent;
        }

        /* Link/hand cursor over the Home area */
        html.home-hover,
        html.home-hover body,
        html.home-hover body *,
        html.home-hover body canvas,
        html.home-hover body ruffle-player {
            cursor: pointer !important;
        }

        /* Scratch 2-style tooltip */
        #homeTooltip {
            position: fixed;
            top: 34px;
            left: 12px;
            z-index: 10002;

            padding: 6px 10px;
            border-radius: 5px;

            background: #333;
            color: #fff;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: normal;
            line-height: 16px;
            white-space: nowrap;

            opacity: 0;
            visibility: hidden;
            transform: translateY(-3px);

            pointer-events: none;

            transition:
                opacity 0.12s ease,
                transform 0.12s ease,
                visibility 0.12s;
        }

        /* Upward-pointing arrow */
        #homeTooltip::before {
    content: "";
    position: absolute;
    left: 12px;
    top: -6px;

    width: 0;
    height: 0;

    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 7px solid #333;

    /* Hide any seam between the arrow and tooltip */
    margin-bottom: -1px;
}

        #homeTooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #boot {
            position: fixed;
            inset: 0;

<body>

    <!-- Click-through Home hotspot -->
    <div id="homeHotspot" aria-hidden="true"></div>

    <!-- Custom tooltip; never intercepts Ruffle input -->
    <div id="homeTooltip" role="tooltip">Home</div>

    <!-- Boot screen -->
    <div id="boot">
        <img
            id="bootIcon"
            src="https://scratch2.cattymod.app/appicons/AppIcon128.png"
            alt=""
        >

        <div id="bootTitle">Scratch 2 Legacy</div>

        <div id="barContainer">
            <div id="bar"></div>
        </div>

        <div id="status">Starting Editor...</div>

        <div id="powered">
            <span>Powered by</span>
            <img src="https://ruffle.rs/demo/logo.svg" alt="Ruffle">
        </div>
    </div>

    <!-- Ruffle player -->
    <div id="ruffle"></div>

    <script>
        const HOME_URL = "https://scratch2.cattymod.app";
        const HOTSPOT_WIDTH = 75;
        const HOTSPOT_HEIGHT = 30;
        const TOOLTIP_DELAY = 500;

        const tooltip = document.getElementById("homeTooltip");

        let tooltipTimer = null;
        let isHomeHovered = false;

        function isOverHomeArea(event) {
            return (
                event.clientX >= 0 &&
                event.clientX <= HOTSPOT_WIDTH &&
                event.clientY >= 0 &&
                event.clientY <= HOTSPOT_HEIGHT
            );
        }

        function updateHomeHover(event) {
            const overHome = isOverHomeArea(event);

            if (overHome === isHomeHovered) {
                return;
            }

            isHomeHovered = overHome;

            document.documentElement.classList.toggle(
                "home-hover",
                overHome
            );

            clearTimeout(tooltipTimer);

            if (overHome) {
                tooltipTimer = setTimeout(() => {
                    if (isHomeHovered) {
                        tooltip.classList.add("visible");
                    }
                }, TOOLTIP_DELAY);
            } else {
                tooltip.classList.remove("visible");
            }
        }

        // Observe pointer movement without blocking Ruffle.
        document.addEventListener(
            "mousemove",
            updateHomeHover,
            true
        );

        // Hide the tooltip when the pointer leaves the browser window.
        document.addEventListener("mouseleave", () => {
            isHomeHovered = false;

            document.documentElement.classList.remove("home-hover");
            tooltip.classList.remove("visible");

            clearTimeout(tooltipTimer);
        });

        // Navigate Home without cancelling the click event.
        document.addEventListener("click", (event) => {
            if (isOverHomeArea(event)) {
                window.location.href = HOME_URL;
            }
        }, true);

        // Initialize Ruffle.
        window.addEventListener("load", async () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            player.style.position = "absolute";
            player.style.top = "0";
            player.style.left = "0";
            player.style.width = "100vw";
            player.style.height = "100vh";
            player.style.margin = "0";
            player.style.padding = "0";

            document.getElementById("ruffle").appendChild(player);

            try {
                const response = await fetch(
                    "https://scratch2.cattymod.app/scratch.swf"
                );

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                await player.load(url);
                player.play();

                setTimeout(() => {
                    const boot = document.getElementById("boot");

                    boot.style.transition = "opacity 0.4s ease";
                    boot.style.opacity = "0";

                    setTimeout(() => {
                        boot.remove();
                    }, 400);
                }, 800);

            } catch (error) {
                console.error("Failed to load SWF:", error);

                document.getElementById("status").textContent =
                    "Failed to load Scratch 2";
            }
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>

</body>
</html>
