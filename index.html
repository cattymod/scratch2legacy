<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Scratch 2 Legacy</title>

<meta name="theme-color" content="#f7f7f7">

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    #ruffle {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: transparent;
    }

    /* ===== HOME BUTTON ===== */
    #homeButton {
        position: fixed;
        top: 3.5px;
        right: 6px;
        width: 20px;
        height: 20px;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
        color: white;
        mix-blend-mode: difference;
        text-decoration: none;
        cursor: pointer;
        background: transparent;
        border: 0;
    }

    #homeButton svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
    }

    /* ===== BOOT SCREEN ===== */
    #boot {
        position: fixed;
        inset: 0;
        background: #f7f7f7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    #bootIcon {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        margin-bottom: 18px;
    }

    #bootTitle {
        font-size: 28px;
        font-weight: bold;
        color: #ffab19;
        margin-bottom: 20px;
    }

    #barContainer {
        width: 220px;
        height: 10px;
        background: #ddd;
        border-radius: 6px;
        overflow: hidden;
    }

    #bar {
        width: 40%;
        height: 100%;
        background: #ffab19;
        animation: load 1.2s infinite ease-in-out;
    }

    @keyframes load {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(300%); }
    }

    #status {
        margin-top: 14px;
        font-size: 12px;
        color: #666;
    }

    #powered {
        margin-top: 10px;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #powered img {
        width: auto;
        height: 14px;
    }
</style>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>


</head>

<body>

<!-- HOME BUTTON -->

<a id="homeButton" href="https://cattymod.app" aria-label="Home" title="Home">
    <i data-lucide="home"></i>
</a>

<!-- BOOT SCREEN -->

<div id="boot">
    <img id="bootIcon" src="https://scratch2.cattymod.app/appicons/AppIcon128.png">
    <div id="bootTitle">Scratch 2 Legacy</div>


<div id="barContainer">
    <div id="bar"></div>
</div>

<div id="status">Starting Editor...</div>

<div id="powered">
    <span>Powered by</span>
    <img src="https://ruffle.rs/demo/logo.svg" alt="Ruffle">
</div>


</div>

<!-- RUFFLE -->

<div id="ruffle"></div>

<script>
lucide.createIcons();

window.addEventListener("load", async () => {

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    player.style.position = "absolute";
    player.style.top = "0";
    player.style.left = "0";
    player.style.width = "100vw";
    player.style.height = "100vh";
    player.style.margin = "0";
    player.style.padding = "0";

    document.getElementById("ruffle").appendChild(player);

    try {
        const res = await fetch("https://scratch2.cattymod.app/scratch.swf");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        await player.load(url);
        player.play();

        // Smooth boot transition
        setTimeout(() => {
            const boot = document.getElementById("boot");
            boot.style.transition = "opacity 0.4s ease";
            boot.style.opacity = "0";

            setTimeout(() => {
                boot.remove();
            }, 400);
        }, 800);

    } catch (e) {
        console.error("Failed to load SWF:", e);
        document.getElementById("status").textContent = "Failed to load Scratch 2";
    }
});

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
